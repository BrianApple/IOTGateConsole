# 网关节点静态配置(替代原Zookeeper注册发现机制)
# 多个节点用逗号分隔，支持 ip 或 ip:port(默认RPC端口10916)
gate.nodes=127.0.0.1

# 节点状态监控探测周期(秒)
gate.monitor.interval=10

#扫描static及之下的所有文件
spring.mvc.static-path-pattern=/static/**

#连接数据库
#spring.datasource.url=jdbc:mysql://localhost:3306/iotgatedb?useUnicode=true&characterEncoding=utf-8
#spring.datasource.username =root
#spring.datasource.password =root
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/iotgatedb?useUnicode=true&characterEncoding=utf-8
spring.datasource.username = root
spring.datasource.password = root
#如果不使用默认的数据源 （com.zaxxer.hikari.HikariDataSource）
spring.datasource.type =com.alibaba.druid.pool.DruidDataSource

server.port=8686
