# 网关节点静态配置(替代原Zookeeper注册发现机制)
# 多个节点用逗号分隔，支持 ip 或 ip:port(默认RPC端口10916)
gate.nodes=127.0.0.1

# 节点状态监控探测周期(秒)
gate.monitor.interval=10

# 网关主动注册(网关 -c -r <consoleIp> 注册后自动加入节点列表，与 gate.nodes 静态配置并存)
# 心跳超时阈值(秒)：超过该时间未收到心跳的节点判离线并移除
gate.registry.heartbeat-timeout-seconds=30
# 离线节点清理扫描周期(秒)
gate.registry.scan-interval-seconds=10

# 智能体模式配置(规约帧结构AI解析)
# 大模型厂商无关：任意 OpenAI 兼容接口均可接入，修改 base-url/model/api-key 即可切换
#   DeepSeek:   https://api.deepseek.com/v1       模型 deepseek-chat
#   通义千问:   https://dashscope.aliyuncs.com/compatible-mode/v1  模型 qwen-plus
#   智谱GLM:    https://open.bigmodel.cn/api/paas/v4  模型 glm-4
#   Ollama本地: http://localhost:11434/v1         模型 本地模型名(如 qwen2.5)
#   OpenAI:     https://api.openai.com/v1         模型 gpt-4o
# api-key 建议通过环境变量 DEEPSEEK_API_KEY 注入，勿硬编码提交；本地模型(Ollama)可留空
ai.api-key=${DEEPSEEK_API_KEY:}
ai.base-url=https://api.deepseek.com/v1
ai.model=deepseek-chat
# 采样温度(0~2，越低越确定) 与 请求超时秒数
ai.temperature=0.1
ai.timeout-seconds=60

#扫描static及之下的所有文件
spring.mvc.static-path-pattern=/static/**

#连接数据库
# 数据库连接信息通过环境变量注入，避免明文口令入库：
#   spring.datasource.url 默认 127.0.0.1:13306/iotgatedb（本地默认端口，可按需覆盖）
#   DB_USERNAME / DB_PASSWORD 环境变量未设置时使用 root/空（本地开发默认）
# 生产部署请务必通过环境变量注入口令，勿在代码/配置中硬编码
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:13306/iotgatedb?useUnicode=true&characterEncoding=utf-8}
spring.datasource.username = ${DB_USERNAME:root}
spring.datasource.password = ${DB_PASSWORD:}
#如果不使用默认的数据源 （com.zaxxer.hikari.HikariDataSource）
spring.datasource.type =com.alibaba.druid.pool.DruidDataSource

server.port=8686
